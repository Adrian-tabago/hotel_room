```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haven Hotel | Guest Account</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }
        :root {
            --navy: #173b35;
            --deep: #102c28;
            --gold: #c9a86a;
            --muted: #71807b;
            --line: #e3e9e5;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 18px;
            color: #243630;
            background: linear-gradient(120deg, rgba(12, 43, 37, .83), rgba(15, 40, 35, .58)), url("https://images.unsplash.com/photo-1611892440504-42a792e24d32?auto=format&fit=crop&w=2000&q=85") center/cover fixed;
        }
        .container {
            position: relative;
            width: 100%;
            max-width: 980px;
            min-height: 610px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            overflow: hidden;
            padding: 0;
            background: #fff;
            border: 1px solid rgba(255,255,255,.5);
            border-radius: 18px;
            box-shadow: 0 28px 80px rgba(0, 0, 0, .28);
            animation: appear .45s ease;
        }
        .container::before {
            content: "A STAY TO REMEMBER";
            grid-column: 1;
            grid-row: 1 / span 3;
            display: flex;
            align-items: flex-end;
            padding: 48px 38px;
            min-height: 100%;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 4px;
            background: linear-gradient(0deg, rgba(12, 38, 32, .78), rgba(12, 38, 32, .05) 72%), url("https://images.unsplash.com/photo-1611892440504-42a792e24d32?auto=format&fit=crop&w=1100&q=85") center/cover;
        }
        @keyframes appear {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo {
            grid-column: 2;
            justify-self: center;
            width: 48px;
            height: 48px;
            margin: 38px 0 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--gold);
            border-radius: 50%;
            color: var(--gold);
            font-family: Georgia, serif;
            font-size: 25px;
            font-weight: 600;
        }
        #loginSection, #signupSection {
            grid-column: 2;
            padding: 0 52px 42px;
            min-width: 0;
        }
        h1 {
            margin: 2px 0 10px;
            color: var(--navy);
            font-family: Georgia, "Times New Roman", serif;
            font-size: 31px;
            font-weight: 500;
            letter-spacing: -.6px;
            text-align: center;
        }
        .subtitle {
            margin: 0 0 30px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.7;
            text-align: center;
        }
        .form-group { margin-bottom: 19px; }
        label {
            display: block;
            margin-bottom: 8px;
            color: #344740;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .3px;
        }
        input {
            width: 100%;
            min-height: 48px;
            padding: 13px 14px;
            border: 1px solid var(--line);
            border-radius: 7px;
            outline: none;
            background: #fbfcfb;
            color: #20352e;
            font-size: 14px;
            transition: border-color .2s, box-shadow .2s, background .2s;
        }
        input:focus {
            border-color: var(--gold);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(201, 168, 106, .15);
        }
        input::placeholder { color: #a3ada8; }
        .password-wrapper { position: relative; }
        .password-wrapper input { padding-right: 65px; }
        .toggle-password {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            color: var(--navy);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }
        .forgot {
            display: block;
            width: fit-content;
            margin: -4px 0 23px auto;
            color: #65766e;
            font-size: 12px;
            text-decoration: none;
        }
        .forgot:hover { color: var(--gold); }
        .submit-btn {
            width: 100%;
            min-height: 49px;
            padding: 13px 18px;
            border: 1px solid var(--navy);
            border-radius: 7px;
            background: var(--navy);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background .2s, transform .2s, border-color .2s;
        }
        .submit-btn:hover {
            background: var(--deep);
            border-color: var(--deep);
            transform: translateY(-1px);
        }
        .switch-text {
            margin-top: 25px;
            color: var(--muted);
            font-size: 12px;
            text-align: center;
        }
        .switch-link {
            margin-left: 4px;
            padding: 0;
            border: 0;
            background: transparent;
            color: var(--navy);
            font-size: 12px;
            font-weight: 700;
            text-decoration: underline;
            text-underline-offset: 3px;
            cursor: pointer;
        }
        .message { margin-top: 15px; font-size: 13px; text-align: center; }
        .error { color: #b42318; }
        .success { color: #157347; }
        [hidden] { display: none !important; }
        #signupSection h1 { font-size: 29px; }
        #signupSection .subtitle { margin-bottom: 23px; }
        #signupSection .form-group { margin-bottom: 15px; }
        #signupSection .switch-text { margin-top: 20px; }
        @media (max-width: 720px) {
            body { padding: 18px 12px; background-attachment: scroll; }
            .container {
                max-width: 460px;
                min-height: auto;
                display: flex;
                flex-direction: column;
                border-radius: 14px;
            }
            .container::before {
                min-height: 135px;
                padding: 24px;
                order: 0;
                background-position: center 55%;
                font-size: 10px;
            }
            .logo { margin: 25px auto 10px; }
            #loginSection, #signupSection { padding: 0 28px 32px; }
            h1 { font-size: 28px; }
            .subtitle { margin-bottom: 24px; }
        }
        @media (max-width: 360px) {
            #loginSection, #signupSection { padding-right: 20px; padding-left: 20px; }
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="logo" aria-label="Haven Hotel">H</div>

        <!-- LOGIN FORM -->
        <section id="loginSection">
            <h1>Welcome Back</h1>
            <p class="subtitle">Sign in to manage your stay and reservations.</p>
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password" required>
                        <button type="button" class="toggle-password" data-target="loginPassword">Show</button>
                    </div>
                </div>
                <a href="#" class="forgot" id="forgotPassword">Forgot password?</a>
                <button type="submit" class="submit-btn">Sign In</button>
            </form>
            <p class="switch-text">Don't have an account?
                <button type="button" class="switch-link" id="showSignup">Create Account</button>
            </p>
        </section>

        <!-- SIGN UP FORM -->
        <section id="signupSection" hidden>
            <h1>Create Account</h1>
            <p class="subtitle">Create your guest account to begin your stay with us.</p>
            <form id="signupForm">

                <!-- ADDED: FULL NAME FIELD -->
                <div class="form-group">
                    <label for="signupName">Full Name</label>
                    <input type="text" id="signupName" placeholder="Enter your full name" autocomplete="name" required>
                </div>

                <div class="form-group">
                    <label for="signupEmail">Email Address</label>
                    <input type="email" id="signupEmail" placeholder="you@example.com" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="signupPassword">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="signupPassword" placeholder="At least 8 characters" minlength="8" autocomplete="new-password" required>
                        <button type="button" class="toggle-password" data-target="signupPassword">Show</button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirmPassword" placeholder="Enter your password again" minlength="8" autocomplete="new-password" required>
                        <button type="button" class="toggle-password" data-target="confirmPassword">Show</button>
                    </div>
                </div>
                <button type="submit" class="submit-btn">Create Account</button>
            </form>
            <p class="switch-text">Already have an account?
                <button type="button" class="switch-link" id="showLogin">Sign In</button>
            </p>
        </section>
    </main>

    <script>
        const loginSection = document.getElementById("loginSection");
        const signupSection = document.getElementById("signupSection");
        const loginForm = document.getElementById("loginForm");
        const signupForm = document.getElementById("signupForm");

        document.getElementById("showSignup").addEventListener("click", () => {
            loginSection.hidden = true;
            signupSection.hidden = false;
        });

        document.getElementById("showLogin").addEventListener("click", () => {
            loginSection.hidden = false;
            signupSection.hidden = true;
        });

        signupForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            try {
       
                const signupName = document.getElementById("signupName").value.trim();

                const signupEmail = document.getElementById("signupEmail").value.trim();
                const signupPassword = document.getElementById("signupPassword").value;
                const confirmPassword = document.getElementById("confirmPassword").value;
                const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

                // ADDED: Validate that the name is not empty
                if (!signupName || !emailPattern.test(signupEmail) || signupPassword.length < 8 || signupPassword !== confirmPassword) {
                    alert("Invalid input");
                    return;
                }

                const response = await fetch("/users", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        
                        name: signupName,
                        email: signupEmail,
                        password: signupPassword
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    alert(data.message || "Registration failed");
                    return;
                }

                alert("Account created successfully!");
                signupForm.reset();
                loginSection.hidden = false;
                signupSection.hidden = true;
            } catch (error) {
                console.error("Error:", error);
                alert("Something went wrong. Please try again.");
            }
        });

        document.querySelectorAll(".toggle-password").forEach(button => {
            button.addEventListener("click", () => {
                const pass = document.getElementById(button.dataset.target);

                if (pass.type === "password") {
                    pass.type = "text";
                    button.textContent = "Hide";
                } else {
                    pass.type = "password";
                    button.textContent = "Show";
                }
            });
        });

        loginForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            await getdata();
        });

        async function getdata() {
            try {
                const email = document.getElementById("loginEmail").value.trim();
                const pass = document.getElementById("loginPassword").value;

                const response = await fetch("/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        email: email,
                        password: pass
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    window.location.href = "rooms.html";
                } else {
                    alert("Failed: " + data.message);
                }
            } catch (error) {
                console.error(error);
                alert("Unable to connect to the server");
            }
        }
    </script>
</body>
</html>
